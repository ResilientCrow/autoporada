# Production stack for the school server (ADR 0008). The repository is
# cloned to /opt/autoporada; run everything from this directory:
#   sudo ./install.sh                  secrets and state, once and after changes
#   docker compose build               the web, worker and tools images, from ..
#   docker compose up -d               migrate, then web and worker, then Caddy
#   docker compose run --rm cli auth:probe
# Configuration is .env (see .env.example; root owns it, so edit it with
# sudo); secrets are files in ./secrets.
name: autoporada

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

x-app-env: &app-env
  APP_ENV: production
  APP_ORIGIN: https://${APP_HOST:?set APP_HOST in .env}
  OIDC_ISSUER: https://login.microsoftonline.com/${TENANT_ID:?set TENANT_ID in .env}/v2.0
  OIDC_TENANT_ID: ${TENANT_ID:?set TENANT_ID in .env}
  # The mail registration, the worker's and the cli's (docs/ENTRA-SETUP.md §1). The web overrides
  # the client id, the thumbprint and the key files with its own registration (ADR 0021).
  OIDC_CLIENT_ID: ${CLIENT_ID:?set CLIENT_ID in .env}
  # From the Entra portal; the boot checks it against secrets/entra_cert.
  OIDC_CLIENT_CERT_THUMBPRINT: ${CERT_THUMBPRINT:?set CERT_THUMBPRINT in .env}
  OIDC_CLIENT_KEY_FILE: /run/secrets/entra_key
  OIDC_CLIENT_CERT_FILE: /run/secrets/entra_cert
  OIDC_DOMAIN_HINT: ${DOMAIN_HINT:-ssps.cz}
  MAIL_TRANSPORT: graph
  MAIL_FROM: ${MAIL_FROM:-autoporada@ssps.cz}
  # The worker converts each generated DOCX to PDF there (ADR 0038); the web never calls it.
  GOTENBERG_URL: http://gotenberg:3000

# Listed before *hardened in a merge: the first map wins, and a one-shot
# must not restart.
x-tools: &tools
  image: autoporada-tools:${APP_VERSION:?set APP_VERSION in .env}
  build: { context: .., dockerfile: docker/app/Dockerfile, target: tools }
  user: '65532:65532'
  restart: 'no'
  tmpfs: ['/tmp']

services:
  caddy:
    <<: *hardened
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    user: '65532:65532'
    # The image gives /usr/bin/caddy this file capability, and the kernel
    # refuses to run a binary whose capability is outside the bounding set.
    cap_add: [NET_BIND_SERVICE]
    # Lets the unprivileged user bind 80 and 443 (Docker's default; explicit here).
    sysctls: { net.ipv4.ip_unprivileged_port_start: '0' }
    ports: ['80:80', '443:443']
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-86400}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./state/caddy/data:/data
      - ./state/caddy/config:/config
    tmpfs: ['/tmp']
    networks: [edge]
    depends_on: { web: { condition: service_healthy } }

  web:
    <<: *hardened
    image: autoporada-web:${APP_VERSION:?set APP_VERSION in .env}
    build: { context: .., dockerfile: docker/app/Dockerfile, target: web }
    user: '65532:65532'
    init: true
    environment:
      <<: *app-env
      # Its own registration (ADR 0021): the sign-in and the directory search, never the mail scope.
      OIDC_CLIENT_ID: ${WEB_CLIENT_ID:?set WEB_CLIENT_ID in .env}
      OIDC_CLIENT_CERT_THUMBPRINT: ${WEB_CERT_THUMBPRINT:?set WEB_CERT_THUMBPRINT in .env}
      OIDC_CLIENT_KEY_FILE: /run/secrets/web_entra_key
      OIDC_CLIENT_CERT_FILE: /run/secrets/web_entra_cert
      DATABASE_URL_FILE: /run/secrets/web_database_url
      BOOTSTRAP_HEADMASTER_OID: ${BOOTSTRAP_HEADMASTER_OID:-}
      # `off` until the smoke test shows the tenant answers the search (SMOKE-TEST step 29).
      DIRECTORY: ${DIRECTORY:-off}
    secrets: [web_database_url, web_entra_key, web_entra_cert]
    tmpfs: ['/tmp:size=64m', '/app/.next/cache']
    # edge: Caddy, and the way out to login.microsoftonline.com and graph.microsoft.com.
    networks: [edge, data]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on: { migrate: { condition: service_completed_successfully } }

  # The job queue and the mail (ADR 0015, 0016): no port, never on edge. One replica only: the
  # gate in the database is a safety net, not a licence to scale.
  worker:
    <<: *hardened
    image: autoporada-worker:${APP_VERSION:?set APP_VERSION in .env}
    build: { context: .., dockerfile: docker/app/Dockerfile, target: worker }
    user: '65532:65532'
    init: true
    # Its stop timeout is STOP_TIMEOUT_MS (src/infra/worker/limits.ts); check-compose wants 10 s more.
    stop_grace_period: 50s
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/worker_database_url
    secrets: [worker_database_url, entra_key, entra_cert]
    tmpfs: ['/tmp:size=8m']
    # data: the database. egress: Entra and Graph. render: Gotenberg.
    networks: [data, egress, render]
    # The alive file is touched while the database answers (src/infra/worker/health.ts); a Graph
    # outage never makes the worker unhealthy, since a restart cannot fix it.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "process.exit(Date.now() - require('fs').statSync('/tmp/worker.alive').mtimeMs < 60000 ? 0 : 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  # DOCX -> PDF for the worker (ADR 0038), with the porada's fonts (docker/gotenberg). No port, no
  # secrets and no way out: only the worker reaches it. A PDF job waits and retries while it is down.
  gotenberg:
    <<: *hardened
    image: autoporada-gotenberg:${APP_VERSION:?set APP_VERSION in .env}
    build: { context: ../docker/gotenberg }
    user: '1001:1001'
    command: ['gotenberg', '--chromium-auto-start=false', '--api-timeout=60s']
    # LibreOffice keeps its profile in the home directory.
    tmpfs: ['/tmp:size=256m', '/home/gotenberg:uid=1001,gid=1001,size=64m']
    networks: [render]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  migrate:
    <<: [*tools, *hardened]
    command: ['migrate']
    environment:
      DATABASE_URL_FILE: /run/secrets/owner_database_url
      HOME: /tmp
    secrets: [owner_database_url]
    networks: [data]
    depends_on: { postgres: { condition: service_healthy } }

  # A shell and the maintenance commands for IT:
  #   docker compose run --rm cli <command>
  #   docker compose run --rm --entrypoint sh cli
  cli:
    <<: [*tools, *hardened]
    profiles: [tools]
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/owner_database_url
      HOME: /tmp
    secrets: [owner_database_url, entra_key, entra_cert]
    networks: [edge, data]

  postgres:
    <<: *hardened
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: '999:999'
    shm_size: 256m
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets: [pg_superuser_password, pg_owner_password, pg_web_password, pg_worker_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs: ['/var/run/postgresql:uid=999,gid=999', '/tmp']
    networks: [data]
    # Over TCP: during initdb the server listens on its socket only.
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'pgadmin', '-d', 'autoporada']
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  # Caddy's way in and out (ACME) and the web's way out to Entra and Graph. The fixed bridge name is
  # the handle for a host firewall rule, like egress below (docs/ENTRA-SETUP.md §4); check-compose
  # asserts it.
  edge:
    driver_opts:
      com.docker.network.bridge.name: ap-edge
  # No way out: only web, worker, migrate and cli reach the database.
  data: { internal: true }
  # egress: any host; the school firewall restricts it (docs/ENTRA-SETUP.md §4). Caddy is not on
  # it. The fixed bridge name is the handle for a host firewall rule (DOCKER-USER or nftables):
  # without it Docker picks a new br-<id> whenever the network is recreated. check-compose
  # asserts it.
  egress:
    driver_opts:
      com.docker.network.bridge.name: ap-egress
  # The worker and Gotenberg only, no way out: a document never leaves the server.
  render: { internal: true }

volumes:
  pgdata: {}

# install.sh creates these, owned by uid 999 (pg_*) or 65532, mode 0400.
secrets:
  pg_superuser_password: { file: ./secrets/pg_superuser_password }
  pg_owner_password: { file: ./secrets/pg_owner_password }
  pg_web_password: { file: ./secrets/pg_web_password }
  pg_worker_password: { file: ./secrets/pg_worker_password }
  owner_database_url: { file: ./secrets/owner_database_url }
  web_database_url: { file: ./secrets/web_database_url }
  worker_database_url: { file: ./secrets/worker_database_url }
  # The certificate pairs of docs/ENTRA-SETUP.md §6: the mail registration's (worker and cli) and
  # the web's own (ADR 0021). No service holds both.
  entra_key: { file: ./secrets/entra_key }
  entra_cert: { file: ./secrets/entra_cert }
  web_entra_key: { file: ./secrets/web_entra_key }
  web_entra_cert: { file: ./secrets/web_entra_cert }
