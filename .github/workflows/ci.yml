name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm lint:palette
      - run: pnpm lint:chars
      - run: pnpm lint:unused
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: autoporada
          POSTGRES_PASSWORD: autoporada
          POSTGRES_DB: autoporada
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autoporada"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://autoporada:autoporada@localhost:5432/autoporada
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - run: pnpm test:golden

  render:
    name: PDF render check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Start Gotenberg with the porada fonts
        run: |
          docker build -t autoporada-gotenberg docker/gotenberg
          docker run -d --name gotenberg -p 3001:3000 autoporada-gotenberg gotenberg --chromium-auto-start=false
          for i in $(seq 1 30); do curl -fs http://localhost:3001/health && break; sleep 2; done
      - run: pnpm test:render

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start Postgres and the mock IdP
        run: |
          docker compose -f compose.dev.yaml up -d --wait postgres mock-idp
          for i in $(seq 1 30); do curl -fs http://localhost:8080/ssps/.well-known/openid-configuration >/dev/null && break; sleep 2; done
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://autoporada:autoporada@localhost:5432/autoporada
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: autoporada
          POSTGRES_PASSWORD: autoporada
          POSTGRES_DB: autoporada
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autoporada"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f docker/app/Dockerfile --target web -t autoporada-web:ci .
      - run: docker build -f docker/app/Dockerfile --target tools -t autoporada-tools:ci .
      - name: Migrate with the tools image (read-only, no capabilities)
        run: >-
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges
          --network host
          -e DATABASE_URL=postgres://autoporada:autoporada@localhost:5432/autoporada
          autoporada-tools:ci migrate
      - run: scripts/check-web-image.sh autoporada-web:ci

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact
      - uses: pnpm/action-setup@v4
      # No `cache: pnpm`: this job never installs, so the post-step cache save
      # would fail on a cache miss.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # osv-scanner cannot read pnpm 12's multi-document lockfile; pnpm audit can.
      - name: Audit production dependencies (blocking)
        run: pnpm audit --prod --audit-level high
      - name: Audit all dependencies (report only)
        run: pnpm audit
        continue-on-error: true
