# Supply-chain hygiene: only install releases older than 3 days and never run
# install scripts unless a package is listed in allowBuilds.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Next.js 16.4.2 is a security release (Oct 2026); take patches immediately.
  - next
  - '@next/*'
allowBuilds: {}
