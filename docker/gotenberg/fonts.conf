<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Substitutes for the template's Microsoft fonts when the originals are not installed. -->
<fontconfig>
  <alias binding="same">
    <family>Aptos Narrow</family>
    <accept><family>PT Sans Narrow</family></accept>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <accept><family>Liberation Serif</family></accept>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <accept><family>Liberation Mono</family></accept>
  </alias>
</fontconfig>
