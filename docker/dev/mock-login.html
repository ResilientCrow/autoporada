<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vývojové přihlášení</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        background: #fff;
        color: #111;
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 32rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      button {
        display: block;
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.75rem;
        text-align: left;
        font: inherit;
      }
      label {
        display: block;
        margin: 1rem 0;
      }
      summary {
        margin: 1.5rem 0 0.5rem;
        cursor: pointer;
      }
      small {
        display: block;
        color: #555;
      }
    </style>
  </head>

    <!-- Stand-in for Entra's sign-in page (mock-oauth2-server, dev and e2e only).
         The personas live in mock-oauth2.json; this page only adds a fresh
         auth_time, which the mappings cannot set. -->

      <p>Toto není Microsoft. Vyberte, za koho se přihlásíte.</p>

        </button>
        <p>
          <small>Obě konta připraví <code>pnpm dev:seed</code>.</small>
        </p>
        <details>
          <summary>Další testovací osoby (automatické testy)</summary>

            <input type="checkbox" name="stale" />

          </label>
          <button type="submit" name="username" value="student">
            Student<small>Petr Svoboda, člen školy</small>
          </button>

            <button type="submit" name="username" value="osloveni-d">

            <button type="submit" name="username" value="osloveni-m">

            </button>
          </fieldset>
        </details>
      </form>
    </main>
    <script>
      // Entra sends auth_time on every sign-in; step-up needs it to be recent.
      // The box makes it an hour old, for the sign-in that step-up must refuse.
      document.querySelector('form').addEventListener('submit', (event) => {
        event.target.elements.claims.value = JSON.stringify({
          auth_time:
            Math.floor(Date.now() / 1000) - (event.target.elements.stale.checked ? 3600 : 0),
        });
      });
    </script>
  </body>
</html>
