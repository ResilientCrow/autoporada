# Publishes the four images of the production stack to this Gitea's container registry when a
# release tag (v0.9.0, …) is pushed (docs/GITEA.md, ADR 0078). The school server then pulls them
# instead of building them (deploy/.env IMAGE_PREFIX). Nothing here names the Gitea: the host and
# the owner come from the run itself, and the login token is the repository secret REGISTRY_TOKEN.
name: Images

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Build and publish the images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Where the images go
        id: where
        run: |
          [ -n "$REGISTRY_TOKEN" ] || { echo '::error::Set the repository secret REGISTRY_TOKEN (docs/GITEA.md)'; exit 1; }
          host="${GITHUB_SERVER_URL#*://}"
          host="${host%%/*}"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "prefix=$host/$owner/" >> "$GITHUB_OUTPUT"
          echo "Publishing to $host/$owner/ as $GITHUB_REF_NAME"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.where.outputs.host }}
          # The account that owns the token; the repository owner unless the variable says otherwise.
          username: ${{ vars.REGISTRY_USER || github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # The school server is 64-bit x86 (docs/DEPLOYMENT.md, "Before you start").
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.where.outputs.prefix }}autoporada-web:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.where.outputs.prefix }}autoporada-worker:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: tools
          platforms: linux/amd64
          push: true
          tags: ${{ steps.where.outputs.prefix }}autoporada-tools:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/gotenberg
          platforms: linux/amd64
          push: true
          tags: ${{ steps.where.outputs.prefix }}autoporada-gotenberg:${{ github.ref_name }}
