# Local development services. Ports bind to 127.0.0.1 only.
#   pnpm dev:services        start
#   pnpm dev:services:down   stop (data volumes are kept)
name: autoporada-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: autoporada
      POSTGRES_PASSWORD: autoporada
      POSTGRES_DB: autoporada
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'autoporada']
      interval: 5s
      timeout: 5s
      retries: 10

  # Captures all outgoing e-mail; UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

  # Stand-in for Microsoft Entra ID. Issuer: http://localhost:8080/ssps
  # The login page (docker/dev/mock-login.html) offers the two dev accounts
  # that `pnpm dev:seed` prepares, a headmaster and a teacher; the e2e personas
  # (docker/dev/mock-oauth2.json) are folded below them.
  mock-idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.1
    environment:
      SERVER_PORT: '8080'
      JSON_CONFIG_PATH: /config/mock-oauth2.json
    volumes: ['./docker/dev:/config:ro']
    ports: ['127.0.0.1:8080:8080']

  # DOCX -> PDF with the fonts the porada needs (docker/gotenberg).
  gotenberg:
    build: ./docker/gotenberg
    image: autoporada-gotenberg:dev
    command:
      - gotenberg
      - --chromium-auto-start=false
      - --chromium-disable-routes
      - --pdfengines-disable-routes
      - --webhook-disable
      - --api-disable-download-from
      - --api-timeout=60s
    ports: ['127.0.0.1:3001:3000']

  # An annex's old .doc -> PDF for the web (ADR 0066): a second instance with the flags of
  # deploy/compose.yaml, so a dev run exercises the same limits.
  gotenberg-import:
    image: autoporada-gotenberg:dev
    command:
      - gotenberg
      - --chromium-auto-start=false
      - --chromium-disable-routes
      - --pdfengines-disable-routes
      - --webhook-disable
      - --api-disable-download-from
      - --libreoffice-deny-private-ips
      - --libreoffice-deny-public-ips
      - --libreoffice-restart-after=1
      - --libreoffice-max-queue-size=2
      - --api-timeout=30s
      - --api-body-limit=11MB
    ports: ['127.0.0.1:3002:3000']

volumes:
  pgdata:
